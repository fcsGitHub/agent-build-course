schema_version: 1
id: L01
revision: 1.0.0
title: Prompt 是输入，不是魔法
stage: "I"
summary: 修改课程开放的系统提示模板，比较编译后消息差异，理解 prompt 改了什么。
prerequisites: [L00]
runtime:
  adapter: reference
  entrypoint: packages/runtime-reference/src/reference-loop.ts
  profile: single_call
learner_input:
  mode: user_authored
  default_text: ""
  auto_send: false
  auto_followups: false
  case_hints: case-hints.yaml
  hint_action: insert_into_draft
  grade_only_matching_task_contract: true
editing:
  policy: edit-policy.yaml
  scope: learner_private_variant
  activation: next_explicit_run
  validation_required: true
  allow_runtime_hot_patch: false
requires:
  model: [streaming]
  tools: []
limits:
  max_turns: 1
  max_model_calls: 1
  max_tool_calls: 0
  max_wall_time_ms: 60000
  max_concurrency: 1
  max_depth: 1
  max_input_tokens: 8000
  max_output_tokens: 2000
observations:
  events:
    - context.compiled
    - model.response_completed
    - run.completed
assets:
  system_prompt: prompts/system.md
grader:
  entrypoint: graders/final-answer-nonempty.ts
  kind: deterministic
