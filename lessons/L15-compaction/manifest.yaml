schema_version: 1
id: L15
revision: 1.0.0
title: 压缩与信息丢失
stage: "II"
summary: 对比无压缩与 tool_result_head 压缩两种策略；压缩可能丢信息，不能只看 token 下降。
prerequisites: [L14]
runtime:
  adapter: reference
  entrypoint: packages/runtime-reference/src/reference-loop.ts
  profile: agent_loop
  compaction: tool_result_head
learner_input:
  mode: user_authored
  default_text: ""
  auto_send: false
  auto_followups: false
  case_hints: case-hints.yaml
  hint_action: insert_into_draft
  grade_only_matching_task_contract: true
requires:
  model: [streaming, native_tools]
  tools: [search_documents]
  sandbox: learner_code_isolate_with_read_only_data
limits:
  max_turns: 4
  max_model_calls: 4
  max_tool_calls: 6
  max_wall_time_ms: 150000
  max_concurrency: 2
  max_depth: 1
  max_input_tokens: 20000
  max_output_tokens: 1500
observations:
  events:
    - tool.call_completed
    - context.compiled
    - model.response_completed
assets:
  system_prompt: prompts/system.md
  docs_manual: ../../datasets/equipment/manual-v2.md
  docs_faq: ../../datasets/equipment/faq.md
