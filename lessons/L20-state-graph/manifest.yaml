schema_version: 1
id: L20
revision: 1.0.0
title: 条件分支与有限循环
stage: "IV"
summary: 观察注册谓词驱动的分支与访问上限如何保证图必然终止。
prerequisites: [L19]
runtime:
  adapter: reference
  entrypoint: packages/runtime-reference/src/reference-loop.ts
  profile: graph
  graph_file: graph.json
learner_input:
  mode: user_authored
  default_text: ""
  auto_send: false
  auto_followups: false
  case_hints: case-hints.yaml
  hint_action: insert_into_draft
  grade_only_matching_task_contract: true
requires:
  model: [streaming]
  tools: [search_documents]
  sandbox: learner_code_isolate_with_read_only_data
limits:
  max_turns: 8
  max_model_calls: 8
  max_tool_calls: 8
  max_wall_time_ms: 180000
  max_concurrency: 2
  max_depth: 1
  max_input_tokens: 20000
  max_output_tokens: 1500
observations:
  events:
    - graph.node_started
    - graph.node_completed
    - run.completed
    - run.failed
assets:
  system_prompt: prompts/system.md
  docs_manual: ../../datasets/equipment/manual-v2.md
  docs_faq: ../../datasets/equipment/faq.md
