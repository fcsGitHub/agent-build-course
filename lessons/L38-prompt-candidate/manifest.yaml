schema_version: 1
id: L38-prompt-candidate
revision: 1.0.0
title: 提示候选评测与晋级
stage: "VII"
summary: 同一任务的两个提示变体在同一冻结验证集上对照；评分与晋级由平台门控，候选不能改评分器。
prerequisites: [L36]
runtime:
  adapter: reference
  entrypoint: packages/runtime-reference/src/reference-loop.ts
  profile: agent_loop
learner_input:
  mode: user_authored
  default_text: ""
  auto_send: false
  auto_followups: false
  case_hints: case-hints.yaml
  hint_action: insert_into_draft
  grade_only_matching_task_contract: true
requires:
  model: [streaming, native_tools]
  tools: [read_text]
  sandbox: learner_code_isolate_with_read_only_data
limits:
  max_turns: 4
  max_model_calls: 4
  max_tool_calls: 4
  max_wall_time_ms: 120000
  max_concurrency: 1
  max_depth: 1
  max_input_tokens: 16000
  max_output_tokens: 1200
observations:
  events:
    - model.response_completed
    - run.completed
assets:
  system_prompt: prompts/system.md
