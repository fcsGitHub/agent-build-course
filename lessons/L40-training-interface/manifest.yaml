schema_version: 1
id: L40-training-interface
revision: 1.0.0
title: 训练接口与诚实边界
stage: "VII"
summary: 讲解训练数据流（导出→任务→权重工件）；本地模式无训练后端时任务停在 unsupported，不可标注训练完成。
prerequisites: [L39]
runtime:
  adapter: reference
  entrypoint: packages/runtime-reference/src/reference-loop.ts
  profile: agent_loop
learner_input:
  mode: user_authored
  default_text: ""
  auto_send: false
  auto_followups: false
  case_hints: case-hints.yaml
  hint_action: insert_into_draft
  grade_only_matching_task_contract: true
requires:
  model: [streaming]
  tools: [read_text]
  sandbox: learner_code_isolate_with_read_only_data
limits:
  max_turns: 3
  max_model_calls: 3
  max_tool_calls: 3
  max_wall_time_ms: 120000
  max_concurrency: 1
  max_depth: 1
  max_input_tokens: 16000
  max_output_tokens: 1200
observations:
  events:
    - model.response_completed
    - run.completed
assets:
  system_prompt: prompts/system.md
  data_flow: datasets/training-data-flow.md
