schema_version: 1
id: L18
revision: 1.0.0
title: 技能包与渐进加载
stage: "III"
summary: 列出技能元信息，按需加载正文；脚本未授权不执行；安装 ≠ 授权。
prerequisites: [L11]
runtime:
  adapter: reference
  entrypoint: packages/runtime-reference/src/reference-loop.ts
  profile: agent_loop
learner_input:
  mode: user_authored
  default_text: ""
  auto_send: false
  auto_followups: false
  case_hints: case-hints.yaml
  hint_action: insert_into_draft
  grade_only_matching_task_contract: true
requires:
  model: [streaming, native_tools]
  tools: [list_skills, load_skill]
  sandbox: learner_code_isolate_with_read_only_data
limits:
  max_turns: 3
  max_model_calls: 3
  max_tool_calls: 4
  max_wall_time_ms: 120000
  max_concurrency: 1
  max_depth: 1
  max_input_tokens: 16000
  max_output_tokens: 1200
observations:
  events:
    - tool.call_completed
    - model.response_completed
assets:
  system_prompt: prompts/system.md
  skill_evidence: ../../skills/evidence-summary-skill
