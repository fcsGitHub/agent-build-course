schema_version: 1
id: L09
revision: 1.0.0
title: 资料导入、切块与索引
stage: "II"
summary: 观察文档如何变成块与向量索引；理解块边界、切块器版本与 embedding 版本。
prerequisites: [L08]
runtime:
  adapter: reference
  entrypoint: packages/runtime-reference/src/reference-loop.ts
  profile: agent_loop
learner_input:
  mode: user_authored
  default_text: ""
  auto_send: false
  auto_followups: false
  case_hints: case-hints.yaml
  hint_action: insert_into_draft
  grade_only_matching_task_contract: true
requires:
  model: [streaming, native_tools]
  tools: [search_documents]
  sandbox: learner_code_isolate_with_read_only_data
limits:
  max_turns: 3
  max_model_calls: 3
  max_tool_calls: 6
  max_wall_time_ms: 120000
  max_concurrency: 2
  max_depth: 1
  max_input_tokens: 16000
  max_output_tokens: 1500
observations:
  events:
    - tool.proposed
    - tool.call_completed
    - model.response_completed
assets:
  system_prompt: prompts/system.md
  docs_manual: ../../datasets/equipment/manual-v2.md
grader:
  entrypoint: graders/cited-answer.ts
  kind: deterministic
