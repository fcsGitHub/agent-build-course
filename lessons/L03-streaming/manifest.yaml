schema_version: 1
id: L03
revision: 1.0.0
title: 流式输出与中断
stage: "I"
summary: 观察 token 批次、首字延迟与终止原因；请求中断不是正常完成。
prerequisites: [L00]
runtime:
  adapter: reference
  entrypoint: packages/runtime-reference/src/reference-loop.ts
  profile: single_call
learner_input:
  mode: user_authored
  default_text: ""
  auto_send: false
  auto_followups: false
  case_hints: case-hints.yaml
  hint_action: insert_into_draft
  grade_only_matching_task_contract: true
requires:
  model: [streaming]
  tools: []
limits:
  max_turns: 1
  max_model_calls: 1
  max_tool_calls: 0
  max_wall_time_ms: 120000
  max_concurrency: 1
  max_depth: 1
  max_input_tokens: 8000
  max_output_tokens: 1000
observations:
  events:
    - model.delta_batch
    - model.response_completed
    - run.cancelled
assets:
  system_prompt: prompts/system.md
