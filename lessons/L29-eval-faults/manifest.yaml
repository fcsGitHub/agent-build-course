schema_version: 1
id: L29-eval-faults
revision: 1.0.0
title: 评测与故障注入
stage: "V"
summary: 基于冻结评测集与故障注入（超时/错误）评估运行；模型声称成功不改变环境终态。
prerequisites: [L06]
runtime:
  adapter: reference
  entrypoint: packages/runtime-reference/src/reference-loop.ts
  profile: agent_loop
learner_input:
  mode: user_authored
  default_text: ""
  auto_send: false
  auto_followups: false
  case_hints: case-hints.yaml
  hint_action: insert_into_draft
  grade_only_matching_task_contract: true
requires:
  model: [streaming, native_tools]
  tools: [read_text, calculator]
  sandbox: learner_code_isolate_with_read_only_data
limits:
  max_turns: 3
  max_model_calls: 3
  max_tool_calls: 4
  max_wall_time_ms: 120000
  max_concurrency: 1
  max_depth: 1
  max_input_tokens: 16000
  max_output_tokens: 1200
observations:
  events:
    - tool.call_completed
    - model.response_completed
assets:
  system_prompt: prompts/system.md
  dataset: ../../datasets/public-course/inventory.csv
