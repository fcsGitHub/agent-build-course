schema_version: 1
id: L24
revision: 1.0.0
title: Harness hooks 与长期任务状态
stage: "V"
summary: 观察 after_model 教学标注 hook 的 diff、before_tool 审计与 run 终态的进展工件。
prerequisites: [L05]
runtime:
  adapter: reference
  entrypoint: packages/runtime-reference/src/reference-loop.ts
  profile: agent_loop
learner_input:
  mode: user_authored
  default_text: ""
  auto_send: false
  auto_followups: false
  case_hints: case-hints.yaml
  hint_action: insert_into_draft
  grade_only_matching_task_contract: true
requires:
  model: [streaming]
  tools: []
  sandbox: learner_code_isolate_with_read_only_data
limits:
  max_turns: 2
  max_model_calls: 2
  max_tool_calls: 0
  max_wall_time_ms: 90000
  max_concurrency: 1
  max_depth: 1
  max_input_tokens: 12000
  max_output_tokens: 1200
observations:
  events:
    - hook.diff
    - model.response_completed
    - task.progress_updated
    - run.completed
assets:
  system_prompt: prompts/system.md
