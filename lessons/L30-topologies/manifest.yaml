schema_version: 1
id: L30-topologies
revision: 1.0.0
title: 移交链：控制权串行转移
stage: "VI"
summary: 两个 worker 串行移交控制权：A 产出成为 B 的输入；事件链可见 handed_off。
prerequisites: [L19]
runtime:
  adapter: reference
  entrypoint: packages/runtime-reference/src/reference-loop.ts
  profile: multi_agent
  multi_agent:
    topology: handoff
    workers:
      - id: researcher
        goal: 检索并整理任务相关事实，输出要点列表。
        tools: []
      - id: writer
        goal: 基于上一环节要点，写一段不超过五句话的总结。
        tools: []
    handoff_chain: [researcher, writer]
learner_input:
  mode: user_authored
  default_text: ""
  auto_send: false
  auto_followups: false
  case_hints: case-hints.yaml
  hint_action: insert_into_draft
  grade_only_matching_task_contract: true
requires:
  model: [streaming]
  tools: []
  sandbox: learner_code_isolate_with_read_only_data
limits:
  max_turns: 6
  max_model_calls: 6
  max_tool_calls: 8
  max_wall_time_ms: 180000
  max_concurrency: 3
  max_depth: 1
  max_input_tokens: 20000
  max_output_tokens: 1500
observations:
  events:
    - agent.delegated
    - agent.result_received
    - run.completed
assets:
  system_prompt: prompts/system.md
