schema_version: 1
id: L17
revision: 1.0.0
title: 情节、语义与程序性记忆
stage: "III"
summary: 同一会话写入三种类别的记忆并分别召回；类别是逻辑维度，作用域才是访问边界。
prerequisites: [L16]
runtime:
  adapter: reference
  entrypoint: packages/runtime-reference/src/reference-loop.ts
  profile: agent_loop
learner_input:
  mode: user_authored
  default_text: ""
  auto_send: false
  auto_followups: false
  case_hints: case-hints.yaml
  hint_action: insert_into_draft
  grade_only_matching_task_contract: true
requires:
  model: [streaming, native_tools]
  tools: [remember, recall]
  sandbox: learner_code_isolate_with_read_only_data
limits:
  max_turns: 4
  max_model_calls: 4
  max_tool_calls: 6
  max_wall_time_ms: 150000
  max_concurrency: 1
  max_depth: 1
  max_input_tokens: 12000
  max_output_tokens: 1200
observations:
  events:
    - tool.call_completed
    - model.response_completed
assets:
  system_prompt: prompts/system.md
