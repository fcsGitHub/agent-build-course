schema_version: 1
id: L08
revision: 1.0.0
title: 固定工作流与自主循环
stage: "II"
summary: 同一任务分别用固定三步工作流与自主循环执行；对照控制流、成本与停止原因。
prerequisites: [L05]
runtime:
  adapter: reference
  entrypoint: packages/runtime-reference/src/reference-loop.ts
  profile: chain
  chain_steps:
    - instruction: "提取任务要点，列出需要查证的参数（不要执行检索）。"
      allow_tools: false
    - instruction: "基于已提取要点，检索资料并记录证据。"
      allow_tools: true
    - instruction: "汇合证据，给出最终回答并引用来源。"
      allow_tools: true
learner_input:
  mode: user_authored
  default_text: ""
  auto_send: false
  auto_followups: false
  case_hints: case-hints.yaml
  hint_action: insert_into_draft
  grade_only_matching_task_contract: true
requires:
  model: [streaming, native_tools]
  tools: [search_documents]
  sandbox: learner_code_isolate_with_read_only_data
limits:
  max_turns: 3
  max_model_calls: 3
  max_tool_calls: 6
  max_wall_time_ms: 120000
  max_concurrency: 2
  max_depth: 1
  max_input_tokens: 16000
  max_output_tokens: 1500
observations:
  events:
    - context.compiled
    - model.response_completed
    - tool.call_completed
    - run.completed
assets:
  system_prompt: prompts/system.md
  docs_manual: ../../datasets/equipment/manual-v2.md
  docs_faq: ../../datasets/equipment/faq.md
