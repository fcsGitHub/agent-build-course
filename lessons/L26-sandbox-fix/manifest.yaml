schema_version: 1
id: L26
revision: 1.0.0
title: 沙箱编码修复
stage: "V"
summary: 修复工作区项目的纯函数 bug，写入补丁并运行真实测试；退出码是唯一通过证据。
prerequisites: [L21]
runtime:
  adapter: reference
  entrypoint: packages/runtime-reference/src/reference-loop.ts
  profile: agent_loop
learner_input:
  mode: user_authored
  default_text: ""
  auto_send: false
  auto_followups: false
  case_hints: case-hints.yaml
  hint_action: insert_into_draft
  grade_only_matching_task_contract: true
requires:
  model: [streaming, native_tools]
  tools: [read_text, write_file, run_test]
  sandbox: learner_code_isolate_with_read_only_data
limits:
  max_turns: 5
  max_model_calls: 5
  max_tool_calls: 8
  max_wall_time_ms: 180000
  max_concurrency: 1
  max_depth: 1
  max_input_tokens: 20000
  max_output_tokens: 2000
observations:
  events:
    - tool.call_completed
    - run.completed
assets:
  system_prompt: prompts/system.md
  project_format: ../../datasets/sandbox-project/format.js
  project_test: ../../datasets/sandbox-project/format.test.js
grader:
  entrypoint: graders/test-output.ts
  kind: deterministic
